@if (editing) {
  <app-stop-editor />
} @else if (planner.open()) {
  <app-planner-panel />
} @else {
  <app-stop-search (stopSelected)="showStop($event)" />
}

@if (!editing) {
<button type="button" class="route-planner-toggle" (click)="planner.toggle()" [class.active]="planner.open()"
        [attr.aria-pressed]="planner.open()" aria-label="Planer trasy" id="planner-toggle-btn">
  @if (planner.open()) {
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20" aria-hidden="true">
      <path d="M18 6 6 18M6 6l12 12"/>
    </svg>
  } @else {
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20" aria-hidden="true">
      <path d="M9 18V5l12-2v13"/>
      <circle cx="6" cy="18" r="3"/>
      <circle cx="18" cy="16" r="3"/>
    </svg>
    <span>Planer Trasy A → B</span>
  }
</button>
}

@if (!editing) {
<app-bus-panel />
<app-stop-panel />

<button type="button" class="vehicles-toggle" [class.active]="buses.enabled()" (click)="buses.toggle()"
        [attr.aria-pressed]="buses.enabled()" aria-label="Autobusy według rozkładu" id="vehicles-toggle-btn"
        title="Gdzie powinny być autobusy według rozkładu jazdy (teraz albo o wybranej godzinie) – bez GPS, bez opóźnień">
  <span aria-hidden="true">🚌</span>
  <span class="toggle-label">Autobusy wg rozkładu</span>
  @if (buses.enabled()) {
    <span class="vehicle-count">{{ buses.buses().length }}</span>
  }
</button>
}

<button type="button" class="locate-btn" (click)="locateUser()" aria-label="Pokaż moją lokalizację" id="locate-me-btn">
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="22" height="22" aria-hidden="true">
    <circle cx="12" cy="12" r="3"/>
    <path d="M12 2v4M12 18v4M2 12h4M18 12h4"/>
  </svg>
</button>

@if (stops.loading()) {
  <div class="map-loading">
    <div class="loading-spinner large"></div>
    <span>Ładowanie przystanków…</span>
  </div>
}

<div class="app-brand">
  <span class="brand-icon">🚌</span>
  <span class="brand-text">JakDojade<strong>Jasło</strong></span>
</div>

<div id="map"></div>
